<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Пауза</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1f2520;--card:#29312a;--cream:#efede6;--green:#a9b59a;--dim:#8a9580}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:"PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);overflow:hidden}
h1{font-family:Philosopher,Georgia,serif;font-weight:400;letter-spacing:.04em;font-size:22px;margin:18px 0 4px;color:var(--green)}
.top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.pill{background:var(--card);color:var(--cream);border:0;border-radius:999px;padding:8px 14px;font-size:14px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{background:transparent;color:var(--dim);border:1px solid var(--dim);border-radius:999px;padding:9px 18px;font-size:15px}
.tab.on{color:var(--bg);background:var(--green);border-color:var(--green)}
main{flex:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.time{font-size:64px;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:10px 0}
.sub{color:var(--dim);font-size:15px;min-height:40px;line-height:1.4;max-width:300px}
.btn{background:var(--green);color:var(--bg);border:0;border-radius:14px;padding:15px 34px;font-size:18px;margin:8px;min-width:180px}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.presets{display:flex;gap:8px;margin:6px 0 14px}
.presets button{background:var(--card);color:var(--cream);border:1px solid transparent;border-radius:10px;padding:8px 14px;font-size:15px}
.presets button.on{border-color:var(--green);color:var(--green)}
.ring{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#3a4639 0%,#2b352b 70%);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-family:Philosopher,Georgia,serif;font-size:26px;transform:scale(.6);transition:transform 3s ease-in-out}
.hidden{display:none!important}
small{color:var(--dim);font-size:12px;padding:10px 0 14px;text-align:center}
</style>
</head>
<body>
<div class="top"><h1 id="title">Пауза</h1><div><button class="pill" id="snd">🔕</button> <button class="pill" id="lng">EN</button></div></div>
<div class="tabs"><button class="tab on" id="t1"></button><button class="tab" id="t2"></button></div>
<main>
<section id="p1">
 <div class="presets" id="presets"></div>
 <div class="time" id="time">90:00</div>
 <div class="sub" id="sub1"></div>
 <button class="btn" id="go"></button>
 <button class="btn ghost hidden" id="toBreath"></button>
</section>
<section id="p2" class="hidden">
 <div class="ring" id="ring"><span id="word"></span></div>
 <div class="time" id="btime" style="font-size:36px">2:00</div>
 <div class="sub" id="sub2"></div>
 <button class="btn" id="bgo"></button>
</section>
</main>
<small id="foot"></small>
<script>
var tg=window.Telegram&&Telegram.WebApp; if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#1f2520');tg.setBackgroundColor('#1f2520')}catch(e){}}
var T={ru:{title:"Пауза",t1:"Таймер",t2:"Дыхание",go:"Начать",stop:"Остановить",sub1:"Поставьте таймер и работайте. Когда он закончится, сделайте паузу.",done:"Пора сделать паузу на 2 минуты.",toBreath:"Дыхание 3 на 6",bgo:"Начать",bstop:"Остановить",sub2:"Вдох на 3, выдох на 6. 2 минуты.",inh:"Вдох",exh:"Выдох",bdone:"Готово. Вернитесь к делам, когда захотите.",min:"мин",foot:"Практика, не лечение. При недомогании к врачу."},
 en:{title:"Pause",t1:"Timer",t2:"Breathing",go:"Start",stop:"Stop",sub1:"Set the timer and work. When it ends, take a pause.",done:"Time for a 2-minute pause.",toBreath:"Breathing 3 to 6",bgo:"Start",bstop:"Stop",sub2:"Inhale for 3, exhale for 6. 2 minutes.",inh:"Inhale",exh:"Exhale",bdone:"Done. Go back whenever you like.",min:"min",foot:"A practice, not a treatment. See a doctor if unwell."}};
var $=function(i){return document.getElementById(i)};
var lang=(function(){try{var s=localStorage.getItem('lang');if(s)return s}catch(e){}
 var c=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code)||navigator.language||'ru';return c.slice(0,2)==='ru'?'ru':'en'})();
var muted=true,mins=90,endAt=0,tick=null,breathing=false,bt=null,bEnd=0,phase=null;
function S(k,v){try{localStorage.setItem(k,v)}catch(e){}} function G(k){try{return localStorage.getItem(k)}catch(e){return null}}
function fmt(ms){var s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function render(){var t=T[lang];document.documentElement.lang=lang;$('title').textContent=t.title;document.title=t.title;
 $('t1').textContent=t.t1;$('t2').textContent=t.t2;$('lng').textContent=lang==='ru'?'EN':'RU';
 $('go').textContent=endAt?t.stop:t.go;$('toBreath').textContent=t.toBreath;$('bgo').textContent=breathing?t.bstop:t.bgo;
 if(!endAt)$('sub1').textContent=t.sub1;$('sub2').textContent=t.sub2;$('foot').textContent=t.foot;
 $('presets').innerHTML='';[60,90,120].forEach(function(m){var b=document.createElement('button');b.textContent=m+' '+t.min;if(m===mins)b.className='on';
  b.onclick=function(){if(endAt)return;mins=m;S('mins',m);$('time').textContent=m+':00';render()};$('presets').appendChild(b)});
 $('snd').textContent=muted?'🔕':'🔔'}
var ac=null;function bell(){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,0.9].forEach(function(d,i){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=i?528:396;
 g.gain.setValueAtTime(0.0001,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+d+.05);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+2.4);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+2.5)})}catch(e){}}
function buzz(){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
function runTimer(){clearInterval(tick);tick=setInterval(function(){var left=endAt-Date.now();if(left<=0){clearInterval(tick);endAt=0;S('endAt','');$('time').textContent='0:00';$('sub1').textContent=T[lang].done;$('toBreath').classList.remove('hidden');bell();buzz();render();return}
 $('time').textContent=fmt(left)},250)}
$('go').onclick=function(){if(endAt){endAt=0;S('endAt','');clearInterval(tick);$('time').textContent=mins+':00';$('sub1').textContent=T[lang].sub1;$('toBreath').classList.add('hidden')}
 else{ac=ac||null;endAt=Date.now()+mins*60000;S('endAt',endAt);$('toBreath').classList.add('hidden');$('sub1').textContent='';runTimer()}render()};
$('toBreath').onclick=function(){show(2)};
function show(n){$('p1').classList.toggle('hidden',n!==1);$('p2').classList.toggle('hidden',n!==2);$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
$('t1').onclick=function(){show(1)};$('t2').onclick=function(){show(2)};
function stopB(msg){clearInterval(bt);breathing=false;phase=null;$('ring').style.transition='transform 1s';$('ring').style.transform='scale(.6)';$('word').textContent='';$('btime').textContent='2:00';if(msg)$('sub2').textContent=msg;render()}
$('bgo').onclick=function(){if(breathing){stopB(T[lang].sub2);return}
 breathing=true;bEnd=Date.now()+120000;var t0=Date.now();phase=null;render();
 bt=setInterval(function(){var el=Date.now()-t0,left=bEnd-Date.now();if(left<=0){stopB(T[lang].bdone);bell();buzz();return}
  $('btime').textContent=fmt(left);var c=el%9000,p=c<3000?'in':'out';
  if(p!==phase){phase=p;var r=$('ring');r.style.transition='transform '+(p==='in'?3:6)+'s ease-in-out';r.style.transform=p==='in'?'scale(1)':'scale(.6)';$('word').textContent=T[lang][p==='in'?'inh':'exh'];try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('soft')}catch(e){}}},200)};
$('snd').onclick=function(){muted=!muted;S('muted',muted?'1':'0');if(!muted)bell();render()};
$('lng').onclick=function(){lang=lang==='ru'?'en':'ru';S('lang',lang);render()};
var m=parseInt(G('mins'));if(m===60||m===90||m===120)mins=m;if(G('muted')==='0')muted=false;
$('time').textContent=mins+':00';
var saved=parseInt(G('endAt'));if(saved&&saved>Date.now()){endAt=saved;runTimer()}else if(saved){S('endAt','');$('sub1').textContent=T[lang].done;$('toBreath').classList.remove('hidden')}
render();
try{fetch('data.json?v='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){['ru','en'].forEach(function(l){if(d[l])for(var k in d[l])T[l][k]=d[l][k]});render()}).catch(function(){})}catch(e){}
</script>
</body>
</html>
